sonar.projectKey=glnsatya352_GitHub-Actions
sonar.organization=glnsatya352


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=GitHub-Actions
sonar.projectVersion=1.0
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Test files are declared separately so they aren't counted toward
# maintainability/duplication metrics on application code.
sonar.tests=.
sonar.test.inclusions=test_*.py

# Coverage report path
sonar.python.coverage.reportPaths=reports/coverage.xml
# unit test report path
sonar.python.xunit.reportPaths=reports/test-coverage.xml

# Unit test (JUnit-style) report path
# Must match the --junitxml path used in the pytest run step
sonar.python.xunit.reportPaths=reports/unit-test-results.xml



# Exclude non-source files from analysis noise (Dockerfile/CI configs are
# not Python source and don't need code-quality rules applied to them)
sonar.exclusions=**/Dockerfile,**/.github/workflows/**


# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8