name: githubaction
on: 
    push:
        branches: 
         - main
    pull_request:
      branches:
        - main
jobs:
    unit-tests:
        name: running unit test
        runs-on: ubuntu-latest
        steps:
         - name: Checkout Code
           uses: actions/checkout@v7
         - name: Setup System
           uses: actions/setup-python@v6.2.0
           with:
               python-version: '3.10'
         - name: install Dependencies
           run: |
               python -m pip install --upgrade pip
               pip install -r requirements.txt
         - name: Run Unit Tests
           run: pytest -v
