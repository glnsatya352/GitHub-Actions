name: githubaction
on: 
    push:
jobs:
    job1:
        name: job1
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: |
                  pwd
                  ls -lrt 
                  hostname
            - name: Checkout
              uses: actions/checkout@v6.0.3
            - name: step3
              run: |
               pwd
               ls -ltr
               hostname
    job2:
        name: job2
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: createfile
              run: |
                  echo 'pwd' >> test.txt
                  ls -lrt
                  hostname
            - name: uploading single file
              uses: actions/upload-artifact@v7.0.1
              with:
                name: single_file
                path: ./test.txt
