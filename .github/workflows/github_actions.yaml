name: githubaction
on: 
    push:
jobs:
    job1:
        name: job1
        runs-on: ubuntu-latest
        steps:
            - name: step1
              run: |
                  pwd
                  ls -lrt 
                  hostname
            - name: Checkout
              uses: actions/checkout@v6.0.3
            - name: step3
              run: |
               pwd
               ls -ltr
               hostname
    job2:
        name: job2
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: createfile
              run: |
                  echo $(pwd )>> test.txt
                  mkdir artifacts
                  echo $(ls -lrt) >> artifacts/list.txt
                  echo $(hostname) >> artifacts/hostname.txt
            - name: uploading single file
              uses: actions/upload-artifact@v7.0.1
              with:
                name: single_file
                path: ./test.txt
            - name: uploading from directory
              uses: actions/upload-artifact@v7.0.1
              with:
                name: directory_artifacts
                path: |
                  artifacts/list.txt
                  artifacts/hostname.txt
    job3:
        name: job3
        runs-on: ubuntu-latest
        needs: job2
        steps:
        - name: directorylocation
          run: |
           echo pwd
        - name: downloadartifacts
          uses: actions/download-artifact@v4
          with:
              name: directory_artifacts
              path: artifacts/
        - name: showfile
          run: |
            cat artifacts/list.txt
            cat artifacts/hostname.txt
